name: 🚀 CI/CD BiblioTech Laravel

on:
  push:
    branches: [ main, seance-* ]
  pull_request:
    branches: [ main ]

env:
  CACHE_DRIVER: file
  DB_CONNECTION: sqlite
  DB_DATABASE: ':memory:'
  MAIL_MAILER: array

jobs:
  tests:
    runs-on: ubuntu-latest
    name: 🧪 Tests (PHP ${{ matrix.php }})
    
    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4]
        
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
        coverage: xdebug

    - name: 📦 Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"

    - name: 🔧 Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: 🔑 Generate key
      run: php artisan key:generate

    - name: 📁 Directory Permissions
      run: chmod -R 755 storage bootstrap/cache

    - name: 🗃️ Create Database
      run: |
        mkdir -p database
        touch database/database.sqlite

    - name: 🏗️ Run Migrations
      run: php artisan migrate --force

    - name: 🌱 Seed Database
      run: php artisan db:seed --force

    - name: 🧪 Execute tests (Unit and Feature tests) via PHPUnit/Pest
      run: php artisan test --coverage-clover coverage.xml

    - name: 📊 Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  code-quality:
    runs-on: ubuntu-latest
    name: 🔍 Code Quality & Security
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3
        extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite

    - name: 🔧 Install Dependencies
      run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

    - name: 🎨 Run Laravel Pint (Code Style)
      run: ./vendor/bin/pint --test

    - name: 🔒 Run Security Checker
      run: composer audit

    - name: 📏 Run PHPStan (Static Analysis)
      run: |
        composer require --dev phpstan/phpstan
        ./vendor/bin/phpstan analyse --memory-limit=2G

  deploy-staging:
    runs-on: ubuntu-latest
    name: 🚀 Deploy to Staging
    needs: [tests, code-quality]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3

    - name: 🔧 Install Dependencies
      run: composer install --no-dev --optimize-autoloader

    - name: 🏗️ Build for production
      run: |
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache

    - name: 📦 Create deployment package
      run: |
        mkdir -p deployment
        tar -czf deployment/bibliotech-laravel.tar.gz \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='tests' \
          --exclude='.github' \
          .

    - name: 📈 Deployment Success Notification
      if: success()
      run: |
        echo "✅ Deployment successful!"
        echo "🎯 Staging URL: https://bibliotech-staging.example.com"

  performance:
    runs-on: ubuntu-latest
    name: ⚡ Performance Tests
    needs: [tests]
    if: github.event_name == 'pull_request'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐘 Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.3

    - name: 🔧 Install Dependencies
      run: composer install

    - name: 🏗️ Setup Application
      run: |
        php -r "file_exists('.env') || copy('.env.example', '.env');"
        php artisan key:generate
        touch database/database.sqlite
        php artisan migrate --seed

    - name: ⚡ Run Performance Tests
      run: |
        # Simuler des tests de performance basiques
        echo "🔥 Running performance benchmarks..."
        php artisan tinker --execute="
          \$start = microtime(true);
          \App\Models\Livre::with('category')->get();
          \$duration = microtime(true) - \$start;
          echo 'Database query performance: ' . round(\$duration * 1000, 2) . 'ms';
        "